<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチルーレット項目選択ツール</title>
    
    <!-- PWAの設定 -->
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="/Roulette/manifest.json">
    <link rel="apple-touch-icon" href="/Roulette/icon-192.png">

    <!-- 読み込み速度向上のためのリソースヒント -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Tailwind CSS (CDN) と Inter フォントの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
        }
        .container-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="flex flex-col items-center p-4 sm:p-6 md:p-10">
    <header class="w-full max-w-4xl mb-6 text-center">
        <h1 class="text-3xl font-bold text-gray-800">🎯 マルチルーレット項目選択ツール</h1>
    </header>
    <main class="w-full max-w-4xl">
        
        <!-- メッセージ表示エリア -->
        <div id="messageBox" class="fixed top-4 right-4 z-50 transition-opacity duration-300 opacity-0 pointer-events-none"></div>

        <!-- 認証情報 -->
        <div class="text-sm text-gray-500 text-center mb-4">
            現在のユーザーID: <span id="userIdDisplay" class="font-mono text-xs bg-gray-200 px-2 py-1 rounded">読み込み中...</span>
        </div>

        <!-- モーダル (確認用) -->
        <div id="confirmModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 hidden items-center justify-center z-50">
            <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
                <h3 id="modalTitle" class="text-lg font-bold mb-4"></h3>
                <p id="modalMessage" class="mb-6 text-gray-700"></p>
                <div class="flex justify-end space-x-3">
                    <button id="modalCancel" class="px-4 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg hover:bg-gray-400 transition">キャンセル</button>
                    <button id="modalConfirm" class="px-4 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition">実行</button>
                </div>
            </div>
        </div>

        <!-- ルーレット管理パネル -->
        <div class="bg-white p-4 rounded-xl container-shadow mb-6">
            <h2 class="text-xl font-semibold mb-3 text-gray-800">🔄 ルーレットの切り替え・管理</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <select id="rouletteSelect" class="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition"></select>
                <button id="addRouletteButton" class="px-4 py-2 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition whitespace-nowrap">＋ ルーレットを追加</button>
                <button id="deleteRouletteButton" class="px-4 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600 transition whitespace-nowrap">🗑️ 削除</button>
            </div>
        </div>
        <!-- ルーレット設定エリア -->
        <div class="bg-white p-4 rounded-xl container-shadow mb-6">
            <h2 id="currentRouletteName" class="text-2xl font-bold mb-4 text-blue-600"></h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 項目生成 -->
                <div class="p-4 border border-gray-200 rounded-lg bg-gray-50">
                    <h3 class="font-semibold text-lg mb-2">① 項目を生成</h3>
                    <p class="text-sm text-gray-600 mb-3">抽選対象となる項目（1, 2, 3...）の個数を指定します。</p>
                    <div class="flex gap-2">
                        <input type="number" id="itemCountInput" value="10" min="1" max="1000" class="w-24 p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition">
                        <button id="generateItemsButton" class="flex-grow px-4 py-2 bg-yellow-500 text-white font-semibold rounded-lg hover:bg-yellow-600 transition">項目を再生成</button>
                    </div>
                </div>

                <!-- 抽選設定 -->
                <div class="p-4 border border-gray-200 rounded-lg bg-gray-50">
                    <h3 class="font-semibold text-lg mb-2">② 抽選設定</h3>
                    <div class="space-y-3">
                        <div class="flex items-center space-x-2">
                            <label for="drawCountInput" class="w-24 text-sm">抽選個数:</label>
                            <input type="number" id="drawCountInput" value="1" min="1" class="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                        <div class="flex items-center space-x-2">
                            <label for="drawMethodSelect" class="w-24 text-sm">抽出方法:</label>
                            <select id="drawMethodSelect" class="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition">
                                <option value="with_replacement">復元抽出 (同じ項目が何度も当たる)</option>
                                <option value="without_replacement">非復元抽出 (当たった項目は減っていく)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 抽選実行と結果表示 -->
        <div class="bg-white p-6 rounded-xl container-shadow mb-6 text-center">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">③ 抽選実行</h2>
            <button id="drawLotteryButton" class="w-full max-w-xs px-6 py-3 bg-blue-600 text-white text-lg font-bold rounded-xl hover:bg-blue-700 transition transform hover:scale-105 active:scale-95 shadow-lg">
                🚀 抽選を実行
            </button>
            
            <h3 class="text-xl font-bold mt-6 mb-2 text-gray-800">抽選結果</h3>
            <div id="lotteryResult" class="text-3xl font-mono p-4 bg-yellow-100 border-2 border-yellow-400 text-gray-900 rounded-xl break-words min-h-[56px] flex items-center justify-center">
                --
            </div>
        </div>

        <!-- 状態と履歴 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 抽選状態 -->
            <div class="bg-white p-4 rounded-xl container-shadow lg:col-span-1">
                <h3 class="font-semibold text-lg mb-3 border-b pb-2 text-gray-800">状態</h3>
                <p class="text-gray-700 mb-2">
                    <span class="font-medium">初期項目数:</span> <span id="initialCount" class="font-mono text-lg text-blue-600">0</span>
                </p>
                <p class="text-gray-700">
                    <span class="font-medium">残り項目数:</span> <span id="remainingCount" class="font-mono text-xl text-green-600 font-bold">0</span>
                </p>
            </div>
            <!-- 抽選履歴 -->
            <div class="bg-white p-4 rounded-xl container-shadow lg:col-span-2">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h3 class="font-semibold text-lg text-gray-800">抽選履歴</h3>
                    <button id="clearHistoryButton" class="text-sm text-red-500 hover:text-red-700 transition">履歴を消去</button>
                </div>
                <div id="historyList" class="max-h-64 overflow-y-auto space-y-2 text-sm">
                    <!-- 履歴アイテムがここに挿入されます -->
                    <p class="text-gray-500 text-center" id="historyPlaceholder">履歴はありません。</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKのインポート (ES Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 1. Firebaseの設定と初期化
        // =========================================================================
        setLogLevel('Debug');
        
        // グローバル変数から設定を取得 (Canvas環境固有)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, currentManager = null;
        let authReady = false;

        try {
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            } else {
                console.error("Firebaseの設定が見つかりません。匿名ログインで続行します。");
            }
        } catch (error) {
            console.error("Firebaseの初期化中にエラーが発生しました:", error);
        }
        // 認証処理
        async function authenticate() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("認証中にエラーが発生しました:", error);
            }
        }

        // データベースと認証の初期化
        if (typeof auth !== 'undefined') {
            authenticate();
        }

        // =========================================================================
        // 2. データ構造とパス定義
        // =========================================================================
        
        // ユーザー固有のデータパスを生成
        const getRouletteDocRef = (userId) => {
            if (!db) return null;
            // データはプライベートデータとして保存: /artifacts/{appId}/users/{userId}/roulette_manager
            const docPath = `artifacts/${appId}/users/${userId}/roulette_manager/data`;
            return doc(db, docPath);
        };

        // ルーレットの初期データ構造
        const createNewRoulette = (name = '新規ルーレット') => ({
            name: name,
            initialItems: [],
            remainingItems: [], // 非復元抽出で使用
            history: [],
            createdAt: Date.now()
        });

        // 管理データの初期構造
        const createInitialManager = (userId) => {
            const initialId = crypto.randomUUID();
            return {
                userId: userId,
                activeRouletteId: initialId,
                roulettes: {
                    [initialId]: createNewRoulette('ルーレット 1')
                }
            };
        };
        // =========================================================================
        // 3. データ操作 (保存)
        // =========================================================================
        
        async function saveRouletteManager() {
            if (!db || !auth.currentUser || !currentManager) {
                throw new Error("データベースまたはマネージャーが初期化されていません。");
            }
            const docRef = getRouletteDocRef(auth.currentUser.uid);
            await setDoc(docRef, currentManager, { merge: true });
        }

        // =========================================================================
        // 4. UI要素の取得とヘルパー関数
        // =========================================================================
        const rouletteSelect = document.getElementById('rouletteSelect');
        const currentRouletteName = document.getElementById('currentRouletteName');
        const itemCountInput = document.getElementById('itemCountInput');
        const drawCountInput = document.getElementById('drawCountInput');
        const drawMethodSelect = document.getElementById('drawMethodSelect');
        const generateItemsButton = document.getElementById('generateItemsButton');
        const drawLotteryButton = document.getElementById('drawLotteryButton');
        const clearHistoryButton = document.getElementById('clearHistoryButton');
        const addRouletteButton = document.getElementById('addRouletteButton');
        const deleteRouletteButton = document.getElementById('deleteRouletteButton');
        const historyList = document.getElementById('historyList');
        const initialCountDisplay = document.getElementById('initialCount');
        const remainingCountDisplay = document.getElementById('remainingCount');
        const userIdDisplay = document.getElementById('userIdDisplay');

        // メッセージボックス
        const messageBox = document.getElementById('messageBox');
        let messageTimeout;

        function showMessage(message, type = 'info') {
            clearTimeout(messageTimeout);
            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            messageBox.innerHTML = `
                <div class="${bgColor} text-white px-4 py-2 rounded-lg container-shadow transition-opacity duration-300">
                    ${message}
                </div>
            `;
            messageBox.classList.remove('opacity-0', 'pointer-events-none');
            messageBox.classList.add('opacity-100');

            messageTimeout = setTimeout(() => {
                messageBox.classList.remove('opacity-100');
                messageBox.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
        // 確認モーダル
        const confirmModal = document.getElementById('confirmModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');
        
        function showConfirmModal(title, message, onConfirm) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            confirmModal.classList.remove('hidden');
            confirmModal.classList.add('flex');

            const confirmHandler = () => {
                onConfirm();
                closeModal();
            };
            const cancelHandler = () => {
                closeModal();
            };

            modalConfirm.addEventListener('click', confirmHandler, { once: true });
            modalCancel.addEventListener('click', cancelHandler, { once: true });

            function closeModal() {
                confirmModal.classList.remove('flex');
                confirmModal.classList.add('hidden');
                modalConfirm.removeEventListener('click', confirmHandler);
                modalCancel.removeEventListener('click', cancelHandler);
            }
        }

        // ルーレット選択ドロップダウンの描画
        function renderRouletteSelect() {
            rouletteSelect.innerHTML = '';
            const ids = Object.keys(currentManager.roulettes);
            ids.forEach(id => {
                const roulette = currentManager.roulettes[id];
                const option = document.createElement('option');
                option.value = id;
                option.textContent = roulette.name;
                if (id === currentManager.activeRouletteId) {
                    option.selected = true;
                }
                rouletteSelect.appendChild(option);
            });
            // 削除ボタンの有効/無効化
            deleteRouletteButton.disabled = ids.length <= 1;
        }

        // 履歴の描画
        function renderHistory(roulette) {
            historyList.innerHTML = '';
            if (roulette.history.length === 0) {
                historyList.innerHTML = '<p class="text-gray-500 text-center">履歴はありません。</p>';
                return;
            }

            // 最新のものが上に来るように逆順で表示
            roulette.history.slice().reverse().forEach((entry, index) => {
                const item = document.createElement('div');
                item.className = 'p-2 border border-gray-100 rounded-lg bg-white shadow-sm';
                const date = new Date(entry.timestamp).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const methodText = entry.method === 'with_replacement' ? '復元' : '非復元';
                item.innerHTML = `
                    <div class="flex justify-between text-xs text-gray-500">
                        <span>${date}</span>
                        <span class="font-mono text-xs px-2 rounded-full ${entry.method === 'with_replacement' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">${methodText}</span>
                    </div>
                    <div class="font-mono text-gray-800 mt-1 break-words">${entry.result.join(', ')}</div>
                `;
                historyList.appendChild(item);
            });
        }
        // ルーレット情報（全体）の描画
        function renderRouletteInfo(roulette) {
            currentRouletteName.textContent = roulette.name;
            itemCountInput.value = roulette.initialItems.length;
            
            initialCountDisplay.textContent = roulette.initialItems.length.toString();
            remainingCountDisplay.textContent = roulette.remainingItems.length.toString();

            // 非復元抽出の場合のみ、残りの項目を強調
            if (drawMethodSelect.value === 'without_replacement' && roulette.remainingItems.length < roulette.initialItems.length) {
                remainingCountDisplay.classList.add('text-red-600');
                remainingCountDisplay.classList.remove('text-green-600');
            } else {
                remainingCountDisplay.classList.remove('text-red-600');
                remainingCountDisplay.classList.add('text-green-600');
            }

            renderHistory(roulette);
        }

        // 抽選実行のロジック
        function drawLottery(roulette, count, method) {
            const result = [];
            
            if (method === 'with_replacement') {
                // 復元抽出 (initialItemsからランダムに選ぶ)
                const items = roulette.initialItems;
                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * items.length);
                    result.push(items[randomIndex]);
                }
            } else {
                // 非復元抽出 (remainingItemsから選ぶ)
                const remaining = roulette.remainingItems;
                for (let i = 0; i < count; i++) {
                    if (remaining.length === 0) break; 

                    const randomIndex = Math.floor(Math.random() * remaining.length);
                    const selectedItem = remaining.splice(randomIndex, 1)[0]; // 項目を削除しながら取得
                    result.push(selectedItem);
                }
                // remainingItemsは参照渡しで更新されているため、元のrouletteオブジェクトにも反映される
            }
            return result;
        }
        // =========================================================================
        // 5. メインアプリケーションの初期化
        // =========================================================================
        
        function initApp(user) {
            const userId = user?.uid || crypto.randomUUID();
            userIdDisplay.textContent = userId;

            // Firestoreからのリアルタイム監視
            if (db) {
                const docRef = getRouletteDocRef(userId);
                
                // リアルタイムリスナー
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        currentManager = docSnap.data();
                        
                        // アクティブIDが存在するかチェック
                        if (!currentManager.roulettes[currentManager.activeRouletteId]) {
                             const ids = Object.keys(currentManager.roulettes);
                            if (ids.length > 0) {
                                currentManager.activeRouletteId = ids[0];
                            }
                        }

                    } else {
                        // データが存在しない場合、初期データを作成し、Firestoreに保存
                        currentManager = createInitialManager(userId);
                        saveRouletteManager().catch(e => {
                            showMessage(`初期データの保存に失敗しました: ${e.message}`, 'error');
                        });
                    }

                    // UIの描画
                    if (currentManager) {
                        renderRouletteSelect();
                        const activeRoulette = currentManager.roulettes[currentManager.activeRouletteId];
                        if (activeRoulette) {
                            renderRouletteInfo(activeRoulette);
                        }
                    }
                }, (error) => {
                    console.error("Firestoreリアルタイム監視エラー:", error);
                    showMessage(`データの読み込み中にエラーが発生しました: ${error.message}`, 'error');
                    // 監視が失敗した場合、ローカルストレージ互換の初期データで起動
                    if (!currentManager) {
                        currentManager = createInitialManager(userId);
                        renderRouletteSelect();
                        renderRouletteInfo(currentManager.roulettes[currentManager.activeRouletteId]);
                        showMessage('Firestore接続エラー: データはセッション中のみ保存されます。', 'error');
                    }
                });
            } else {
                // Firebaseが初期化されていない場合のフォールバック（機能は限定的）
                currentManager = createInitialManager(userId);
                renderRouletteSelect();
                renderRouletteInfo(currentManager.roulettes[currentManager.activeRouletteId]);
                showMessage('警告: Firebase接続がありません。データは保存されません。', 'error');
            }

            // =========================================================================
            // 5. イベントリスナー
            // =========================================================================
            // 項目生成ボタンのイベントリスナー (1)
            generateItemsButton.addEventListener('click', () => {
                const currentRoulette = currentManager.roulettes[currentManager.activeRouletteId];
                const count = parseInt(itemCountInput.value, 10);
                
                if (isNaN(count) || count < 1 || count > 1000) {
                    showMessage('項目数は1から1000の間で入力してください。', 'error');
                    return;
                }

                const confirmTitle = '項目再生成の確認';
                const confirmMessage = currentRoulette.initialItems.length > 0
                    ? '既存の項目を破棄し、新しく' + count + '個の項目を生成します。よろしいですか？'
                    : count + '個の項目を生成します。';

                showConfirmModal(confirmTitle, confirmMessage, () => {
                    currentRoulette.initialItems = Array.from({ length: count }, (_, i) => String(i + 1));
                    currentRoulette.remainingItems = [...currentRoulette.initialItems];
                    currentRoulette.history = []; // 項目が変わるので履歴はクリア

                    saveRouletteManager().then(() => {
                        renderRouletteInfo(currentRoulette);
                        showMessage(count + '個の項目を生成しました。', 'success');
                    }).catch(e => {
                        showMessage(`項目の生成と保存に失敗しました: ${e.message}`, 'error');
                    });
                });
            });
            // 抽選開始ボタンのイベントリスナー (2)
            drawLotteryButton.addEventListener('click', () => {
                const currentRoulette = currentManager.roulettes[currentManager.activeRouletteId];
                const drawCount = parseInt(drawCountInput.value, 10);
                const method = drawMethodSelect.value;
                const availableCount = currentRoulette.remainingItems.length;

                if (drawCount < 1 || isNaN(drawCount)) {
                    showMessage('抽選個数は1個以上を指定してください。', 'error');
                    return;
                }

                if (availableCount === 0) {
                    showMessage('残りの項目がありません。項目を再生成してください。', 'error');
                    return;
                }
                if (method === 'without_replacement' && drawCount > availableCount) {
                    showMessage(`非復元抽出では、残りの項目数（${availableCount}）を超える個数を抽選できません。`, 'error');
                    return;
                }

                const result = drawLottery(currentRoulette, drawCount, method);
                currentRoulette.history.push({ 
                    timestamp: Date.now(), 
                    result: result.sort((a, b) => parseInt(a) - parseInt(b)), 
                    method: method 
                });

                // 結果を表示
                document.getElementById('lotteryResult').textContent = result.sort((a, b) => parseInt(a) - parseInt(b)).join(', ');
                showMessage('抽選が完了しました！', 'success');
                
                // 履歴は最大50件に制限
                if (currentRoulette.history.length > 50) {
                    currentRoulette.history.splice(0, currentRoulette.history.length - 50);
                }

                saveRouletteManager().then(() => {
                    renderRouletteInfo(currentRoulette);
                }).catch(e => {
                    showMessage(`抽選結果の保存に失敗しました: ${e.message}`, 'error');
                });
            });
            // 履歴消去ボタンのイベントリスナー (3)
            clearHistoryButton.addEventListener('click', () => {
                showConfirmModal('履歴の全消去確認', 
                                 '現在のルーレットの抽選履歴をすべて消去します。よろしいですか？', 
                                 () => {
                    const currentRoulette = currentManager.roulettes[currentManager.activeRouletteId];
                    currentRoulette.history = [];
                    
                    saveRouletteManager().then(() => {
                        renderRouletteInfo(currentRoulette);
                        showMessage('履歴を消去しました。', 'success');
                    }).catch(e => {
                        showMessage(`履歴の消去に失敗しました: ${e.message}`, 'error');
                    });
                });
            });
            // ルーレット追加ボタンのイベントリスナー (4)
            addRouletteButton.addEventListener('click', () => {
                const name = prompt('新しいルーレットの名前を入力してください:');
                if (name && name.trim()) {
                    const newId = crypto.randomUUID();
                    currentManager.roulettes[newId] = createNewRoulette(name.trim());
                    currentManager.activeRouletteId = newId;

                    saveRouletteManager().then(() => {
                        renderRouletteSelect();
                        renderRouletteInfo(currentManager.roulettes[newId]);
                        showMessage(`「${name.trim()}」を作成しました。`, 'success');
                    }).catch(e => {
                        showMessage(`ルーレットの作成に失敗しました: ${e.message}`, 'error');
                    });
                }
            });
            // ルーレット削除ボタンのイベントリスナー (5)
            deleteRouletteButton.addEventListener('click', () => {
                const currentId = currentManager.activeRouletteId;
                const rouletteIds = Object.keys(currentManager.roulettes);

                if (rouletteIds.length <= 1) {
                    showMessage('ルーレットは最低1つ必要です。削除できません。', 'error');
                    return;
                }

                showConfirmModal('ルーレットの削除確認', 
                                 `「${currentManager.roulettes[currentId].name}」を削除します。よろしいですか？`, 
                                 () => {
                    // 現在のルーレットを削除
                    delete currentManager.roulettes[currentId];
                    // 新しいアクティブなIDを設定 (残っている最初のID)
                    const newActiveId = Object.keys(currentManager.roulettes)[0];
                    currentManager.activeRouletteId = newActiveId;

                    saveRouletteManager().then(() => {
                        renderRouletteSelect();
                        renderRouletteInfo(currentManager.roulettes[newActiveId]);
                        showMessage('ルーレットを削除しました。', 'success');
                    }).catch(e => {
                        showMessage(`ルーレットの削除に失敗しました: ${e.message}`, 'error');
                    });
                });
            });
            // ルーレット切り替えドロップダウンの変更イベントリスナー (6)
            rouletteSelect.addEventListener('change', (e) => {
                const newId = e.target.value;
                if (newId) {
                    currentManager.activeRouletteId = newId;
                    saveRouletteManager().then(() => {
                        renderRouletteInfo(currentManager.roulettes[newId]);
                    }).catch(e => {
                        showMessage(`ルーレットの切り替えに失敗しました: ${e.message}`, 'error');
                    });
                }
            });
            // =========================================================================
            // 6. Service Workerの登録 (PWAインストール機能の有効化)
            // =========================================================================

            // Service Workerの登録関数
            const registerServiceWorker = () => {
                if ('serviceWorker' in navigator) {
                    // GitHub PagesのサブディレクトリURLに対応するため、scopeとパスを指定
                    // [重要] リポジトリ名 (Roulette) をパスに含める
                    const serviceWorkerPath = '/Roulette/service-worker.js'; 
                    
                    navigator.serviceWorker.register(serviceWorkerPath, { scope: '/Roulette/' })
                        .then((registration) => {
                            console.log('Service Worker 登録成功:', registration.scope);
                        })
                        .catch((error) => {
                            console.error('Service Worker 登録失敗:', error);
                        });
                }
            };
            
            // アプリ初期化処理の最後にService Workerを登録
            window.addEventListener('load', registerServiceWorker);
            
        } // <-- initApp() 関数の閉じ括弧
        // アプリケーション全体のエントリーポイント
        // Firebase認証状態が確定した後、initAppを呼び出す
        if (typeof auth !== 'undefined') {
            onAuthStateChanged(auth, (user) => {
                if (!authReady) {
                    // 認証状態が確定し、ユーザーオブジェクトが設定されたら
                    // 初回のみinitAppを実行
                    authReady = true;
                    initApp(user); 
                }
            });
        }
    </script>
</body>
</html>
