<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチルーレット項目選択ツール</title>
    
    <!-- PWA設定: ブラウザにインストールを促すためのメタデータ -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="MultiRoulette">
    
    <!-- PWA設定: manifest.jsonへのリンク (注: このファイルは別途作成・配置が必要です) -->
    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, addDoc, serverTimestamp, where, getDocs, deleteDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firestoreのデバッグログを有効にする
        setLogLevel('Debug');

        // グローバル変数（Canvas環境から提供されるものを利用）
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        let userId = null;
        
        // 全ルーレット設定を管理するオブジェクト
        let rouletteManager = {
            activeRouletteId: null,
            roulettes: [], // { id, name, numItems, drawCount, isReplacement, items } の配列
        };
        let historyList = [];

        // 項目名 ("項目N") から数字 ("N") を抽出するユーティリティ関数
        const getNumberFromItem = (item) => {
            const match = item.match(/項目(\d+)/);
            return match ? match[1] : item; 
        };

        // =========================================================================
        // 1. Firebase初期化と認証
        // =========================================================================
        
        // ルーレットマネージャーの設定ドキュメントパス
        const getRouletteManagerDocPath = (uid) => 
            `artifacts/${appId}/users/${uid}/settings/roulette_manager`;
        
        // 全ルーレット共通の履歴コレクションパス
        const getHistoryCollectionPath = (uid) => 
            `artifacts/${appId}/users/${uid}/history`;

        // データベースと認証の初期化
        const initFirebase = async () => {
            try {
                if (!firebaseConfig.apiKey) {
                    throw new Error("Firebase configuration is missing.");
                }
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // 認証ロジック
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                // 認証状態の監視
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('user-id-display').textContent = `ユーザーID: ${userId}`;
                        console.log("Firebase Auth Ready. User ID:", userId);
                        
                        // 認証完了後、設定と履歴のリスナーを開始
                        setupListeners();
                    } else {
                        console.log("No user signed in.");
                        userId = null;
                    }
                });
            } catch (error) {
                console.error("Firebaseの初期化エラー:", error);
                document.getElementById('status-message').textContent = `エラー: ${error.message}`;
            }
        };

        // =========================================================================
        // 2. データ監視とUI更新
        // =========================================================================

        const setupListeners = () => {
            if (!userId || !db) return;

            // 1. ルーレット設定マネージャーのリアルタイム監視
            const managerDocRef = doc(db, getRouletteManagerDocPath(userId));
            onSnapshot(managerDocRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().roulettes && docSnap.data().roulettes.length > 0) {
                    rouletteManager = { ...rouletteManager, ...docSnap.data() };
                    
                    // アクティブなルーレットが存在しない場合は、最初のルーレットをアクティブにする
                    if (!rouletteManager.activeRouletteId || !rouletteManager.roulettes.some(r => r.id === rouletteManager.activeRouletteId)) {
                         rouletteManager.activeRouletteId = rouletteManager.roulettes[0].id;
                         saveRouletteManager(); // activeRouletteIdを更新して保存
                         return; // 再度リスナーが呼ばれるのを待つ
                    }
                    
                    updateRouletteUI(); // UIを更新
                } else {
                    // 設定ドキュメントが存在しない、またはルーレットが空の場合、初期ルーレットを作成
                    createInitialRoulette();
                }
            }, (error) => console.error("ルーレットマネージャーの取得エラー:", error));

            // 2. 履歴のリアルタイム監視 (全ルーレット共通コレクション)
            const historyColRef = collection(db, getHistoryCollectionPath(userId));
            const q = query(historyColRef, orderBy("timestamp", "desc"), limit(50)); // 最新50件

            onSnapshot(q, (querySnapshot) => {
                historyList = [];
                querySnapshot.forEach((doc) => {
                    historyList.push(doc.data());
                });
                renderHistory(); // 履歴リスト全体の更新後にレンダリング
            }, (error) => console.error("履歴の取得エラー:", error));
        };
        
        // =========================================================================
        // 3. ルーレット設定の管理
        // =========================================================================

        /** アクティブなルーレットの設定オブジェクトを取得 */
        const getActiveRoulette = () => {
            return rouletteManager.roulettes.find(r => r.id === rouletteManager.activeRouletteId);
        };
        
        /** ルーレットマネージャー全体をFirestoreに保存 */
        const saveRouletteManager = async () => {
            if (!userId) {
                console.error("ユーザーIDが未定義のため保存できません。");
                return;
            }
            try {
                const managerDocRef = doc(db, getRouletteManagerDocPath(userId));
                await setDoc(managerDocRef, { ...rouletteManager, timestamp: serverTimestamp() }, { merge: true });
                console.log("ルーレットマネージャーを保存しました。");
            } catch (e) {
                console.error("ルーレットマネージャーの保存エラー:", e);
                showModal('エラー', '設定の保存に失敗しました。');
            }
        };

        /** * 現在アクティブなルーレットの設定を更新し、Firestoreに保存 
         * @param {Object} newConfig - 更新する設定プロパティ
         */
        const updateActiveRouletteConfig = (newConfig) => {
            const active = getActiveRoulette();
            if (!active) return;

            const updatedRoulette = { ...active, ...newConfig };
            
            rouletteManager.roulettes = rouletteManager.roulettes.map(r => 
                r.id === rouletteManager.activeRouletteId ? updatedRoulette : r
            );

            // UIを更新
            updateSettingsUI(updatedRoulette);
            // Firestoreに保存
            saveRouletteManager();
        };

        /** 初回起動時またはリセット時に初期ルーレットを作成 */
        const createInitialRoulette = () => {
            const initialId = crypto.randomUUID();
            const defaultItems = Array.from({ length: 10 }, (_, i) => `項目${i + 1}`);

            rouletteManager.roulettes = [{
                id: initialId,
                name: "メインルーレット",
                numItems: 10,
                drawCount: 1,
                isReplacement: true,
                items: defaultItems,
            }];
            rouletteManager.activeRouletteId = initialId;
            saveRouletteManager();
        };

        /** 新しいルーレットを追加 */
        const addNewRoulette = () => {
            const newId = crypto.randomUUID();
            const newName = `新しいルーレット ${rouletteManager.roulettes.length + 1}`;
            const defaultItems = Array.from({ length: 10 }, (_, i) => `項目${i + 1}`);

            const newRoulette = {
                id: newId,
                name: newName,
                numItems: 10,
                drawCount: 1,
                isReplacement: true,
                items: defaultItems,
            };

            rouletteManager.roulettes.push(newRoulette);
            rouletteManager.activeRouletteId = newId; // 追加したものをアクティブにする
            saveRouletteManager();
        };
        
        /** 現在アクティブなルーレットを削除 */
        const deleteActiveRoulette = () => {
            if (rouletteManager.roulettes.length <= 1) {
                showModal('警告', '最後のルーレットは削除できません。');
                return;
            }

            // 履歴削除の確認モーダルを表示
            showModal('ルーレット削除の確認', 'このルーレットを削除しますか？紐づく履歴も完全に消去されます。', true);
        };
        
        /** 項目配列を生成し、アクティブなルーレットの設定を更新する */
        const generateAndUpdateItems = (count, forceSave = false) => {
            const active = getActiveRoulette();
            if (!active) return;
            
            const num = Math.min(Math.max(1, parseInt(count, 10) || 1), 1000);
            
            // 既存の項目をベースに項目数を調整
            const newItems = [];
            for (let i = 1; i <= num; i++) {
                newItems.push(active.items[i-1] || `項目${i}`);
            }

            const newConfig = {
                numItems: num,
                items: newItems,
                drawCount: Math.min(active.drawCount, num), // 抽選個数を項目数以下に制限
            };

            // 項目数が変わったか、強制保存フラグがあれば保存
            if (forceSave || num !== active.items.length) {
                updateActiveRouletteConfig(newConfig);
            } else {
                 updateSettingsUI({ ...active, ...newConfig });
            }
        };

        // =========================================================================
        // 4. UI/アニメーション/イベント処理
        // =========================================================================
        
        /** ルーレット管理UI（ドロップダウン）の更新 */
        const renderRouletteSelect = () => {
            const select = document.getElementById('roulette-select');
            const active = getActiveRoulette();
            
            if (!active) {
                select.innerHTML = '<option value="">ルーレットがありません</option>';
                return;
            }

            select.innerHTML = rouletteManager.roulettes.map(r => 
                `<option value="${r.id}" ${r.id === rouletteManager.activeRouletteId ? 'selected' : ''}>${r.name}</option>`
            ).join('');
            
            // 現在のルーレット名も表示
            document.getElementById('current-roulette-name').textContent = active.name;
        };
        
        /** 全体のUIをアクティブなルーレット設定に合わせて更新 */
        const updateRouletteUI = () => {
            const active = getActiveRoulette();
            if (!active) return;

            renderRouletteSelect(); // ルーレット選択UIの更新
            updateSettingsUI(active); // 設定フォームの更新
            renderHistory(); // 履歴リストの更新
        };

        /** 設定フォーム（項目数、抽選個数、復元スイッチ）の更新 */
        const updateSettingsUI = (settings) => {
            document.getElementById('num-items-input').value = settings.numItems;
            document.getElementById('draw-count-select').innerHTML = generateDrawCountOptions(settings.numItems, settings.drawCount);
            
            const replacementSwitch = document.getElementById('replacement-switch');
            replacementSwitch.checked = settings.isReplacement;
            
            // スイッチの見た目を更新
            updateReplacementSwitchAppearance(settings.isReplacement);
        };

        /** 復元抽出スイッチの見た目（色とドット位置）を更新する */
        const updateReplacementSwitchAppearance = (isReplacement) => {
            const replacementSwitch = document.getElementById('replacement-switch');
            const switchContainer = replacementSwitch.nextElementSibling; // .toggle-switch-bg (label)
            const switchDot = switchContainer.nextElementSibling; // .toggle-switch-dot (div)

            const translateXValue = '2rem'; 

            if (isReplacement) {
                // 復元抽出 (含める): 青色 (右側)
                switchContainer.classList.add('bg-blue-600');
                switchContainer.classList.remove('bg-red-500');
                switchDot.style.transform = `translateX(${translateXValue})`; // 2rem に移動
            } else {
                // 非復元抽出 (含めない): 赤色 (左側)
                switchContainer.classList.remove('bg-blue-600');
                switchContainer.classList.add('bg-red-500');
                switchDot.style.transform = 'translateX(0rem)'; // 初期位置 (0rem)
            }
        };

        // 抽選個数ドロップダウンのオプションを生成
        const generateDrawCountOptions = (max, selected) => {
            let options = '';
            for (let i = 1; i <= max; i++) {
                options += `<option value="${i}" ${i === selected ? 'selected' : ''}>${i}個</option>`;
            }
            return options;
        };
        
        // 抽選履歴のレンダリング
        const renderHistory = () => {
            const historyContainer = document.getElementById('history-list');
            historyContainer.innerHTML = ''; // リストをクリア
            
            const activeId = rouletteManager.activeRouletteId;
            // アクティブなルーレットIDで履歴をフィルタリング
            const filteredHistory = historyList.filter(h => h.rouletteId === activeId);

            if (filteredHistory.length === 0) {
                historyContainer.innerHTML = '<p class="text-gray-500 p-4">このルーレットの抽選履歴はありません。</p>';
                return;
            }

            filteredHistory.forEach((entry, index) => {
                const time = entry.timestamp ? new Date(entry.timestamp.seconds * 1000).toLocaleTimeString('ja-JP') : '取得中';
                const date = entry.timestamp ? new Date(entry.timestamp.seconds * 1000).toLocaleDateString('ja-JP') : '';
                
                // 当選項目を数字に変換し、HTMLタグで囲む (項目名ではなく数字のみ表示)
                const drawnNumbers = entry.drawnItems.map(getNumberFromItem);
                const itemsHtml = drawnNumbers.map(number => `<span class="inline-block bg-green-100 text-green-800 text-xs font-semibold px-2 py-0.5 rounded-full">${number}</span>`).join(' ');
                
                const replacementText = entry.isReplacementUsed ? '復元' : '非復元';
                
                const item = document.createElement('div');
                item.className = `p-3 border-b border-gray-100 ${index === 0 ? 'bg-yellow-50 shadow-md' : ''}`;
                item.innerHTML = `
                    <div class="flex justify-between items-center text-sm mb-1">
                        <span class="font-bold text-gray-700">${date} ${time}</span>
                        <span class="text-xs text-blue-600 bg-blue-100 px-2 py-0.5 rounded">${replacementText} (${entry.drawCount}個)</span>
                    </div>
                    <div class="text-gray-900 font-medium space-x-1">${itemsHtml}</div>
                `;
                historyContainer.appendChild(item);
            });
        };
        
        // 簡易モーダル表示
        const showModal = (title, message, isConfirmation = false) => {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;

            const confirmBtn = document.getElementById('modal-confirm-button');
            const closeBtn = document.getElementById('modal-close-button');

            if (isConfirmation) {
                // 削除確認のロジック
                confirmBtn.classList.remove('hidden');
                confirmBtn.onclick = () => {
                    closeModal();
                    if (title.includes('履歴')) {
                        performClearHistory();
                    } else if (title.includes('ルーレット')) {
                        performDeleteRoulette();
                    }
                };
            } else {
                confirmBtn.classList.add('hidden');
            }

            closeBtn.textContent = isConfirmation ? 'キャンセル' : '閉じる';
            modal.classList.remove('hidden');
        };

        // モーダル非表示
        const closeModal = () => {
            document.getElementById('custom-modal').classList.add('hidden');
            // 確認ボタンのイベントリスナーをリセット
            document.getElementById('modal-confirm-button').onclick = null; 
        };

        // 簡易ルーレットアニメーション
        const animateRoulette = (finalText) => {
            const rouletteDisplay = document.getElementById('roulette-display');
            rouletteDisplay.textContent = '...'; // アニメーション開始
            rouletteDisplay.classList.add('animate-bounce'); 

            setTimeout(() => {
                rouletteDisplay.textContent = finalText;
                rouletteDisplay.classList.remove('animate-bounce');
                rouletteDisplay.classList.add('animate-pop'); 
                setTimeout(() => rouletteDisplay.classList.remove('animate-pop'), 500);
            }, 1000); // 1秒後に結果を表示
        };


        // =========================================================================
        // 5. 抽選と履歴処理
        // =========================================================================

        const drawLottery = async () => {
            const active = getActiveRoulette();
            if (!active || !active.items.length) {
                showModal('エラー', '項目が設定されていません。');
                return;
            }

            const { items, drawCount, isReplacement } = active;
            
            if (!isReplacement && drawCount > items.length) {
                showModal('エラー', `非復元抽出では、抽選個数(${drawCount})は残りの項目数(${items.length})を超えられません。項目数をリセットしてください。`);
                return;
            }
            
            const availableItems = [...items]; // 抽選に使用する配列 (シャローコピー)
            const drawnItems = [];
            
            const rouletteContainer = document.getElementById('roulette-container');
            const resultDisplay = document.getElementById('result-display');
            rouletteContainer.classList.add('animate-pulse');
            resultDisplay.textContent = '抽選中...';

            // 抽選処理
            for (let i = 0; i < drawCount; i++) {
                if (availableItems.length === 0) break;

                const randomIndex = Math.floor(Math.random() * availableItems.length);
                const selectedItem = availableItems[randomIndex];
                drawnItems.push(selectedItem);

                if (!isReplacement) {
                    // 非復元抽出の場合、当選した項目をリストから削除
                    availableItems.splice(randomIndex, 1);
                }
            }
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            rouletteContainer.classList.remove('animate-pulse');

            if (drawnItems.length === 0) {
                 showModal('エラー', '抽選できる項目がありません。');
                 resultDisplay.textContent = '抽選失敗';
                 return;
            }
            
            // 抽選結果を数字でソート
            drawnItems.sort((a, b) => {
                const numA = parseInt(getNumberFromItem(a), 10);
                const numB = parseInt(getNumberFromItem(b), 10);
                
                if (!isNaN(numA) && !isNaN(numB)) {
                    return numA - numB;
                }
                return a.localeCompare(b, 'ja'); 
            });

            // 結果表示
            const drawnNumbers = drawnItems.map(getNumberFromItem);
            const resultText = drawnNumbers.join(', ');
            resultDisplay.textContent = `結果: ${resultText}`;
            
            // 履歴に保存
            await saveHistory(drawnItems, drawCount, isReplacement, active.id);

            animateRoulette(resultText); 

            // 非復元抽出の場合、設定を更新
            if (!isReplacement) {
                const updatedItems = items.filter(item => !drawnItems.includes(item));
                
                // アクティブなルーレット設定を更新
                updateActiveRouletteConfig({
                    items: updatedItems,
                    numItems: updatedItems.length,
                    drawCount: Math.min(drawCount, updatedItems.length) // 抽選個数も調整
                });
            }
        };

        // 抽選履歴の保存
        const saveHistory = async (drawnItems, drawCount, isReplacementUsed, rouletteId) => {
            if (!userId) return;
            try {
                const historyColRef = collection(db, getHistoryCollectionPath(userId));
                await addDoc(historyColRef, {
                    rouletteId: rouletteId, // ルーレットIDを履歴に紐づける
                    drawnItems, 
                    drawCount,
                    isReplacementUsed,
                    timestamp: serverTimestamp()
                });
                console.log("履歴を保存しました。");
            } catch (e) {
                console.error("履歴の保存エラー:", e);
            }
        };
        
        /** 現在アクティブなルーレットの履歴をFirestoreから全て削除 */
        const performClearHistory = async () => {
            if (!userId) return;

            const activeId = rouletteManager.activeRouletteId;
            const historyColRef = collection(db, getHistoryCollectionPath(userId));
            
            try {
                // アクティブなルーレットIDに紐づく全ての履歴ドキュメントを取得
                const q = query(historyColRef, where('rouletteId', '==', activeId));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    showModal('完了', '削除する履歴はありませんでした。');
                    return;
                }

                let deleteCount = 0;
                snapshot.forEach(doc => {
                    deleteDoc(doc.ref); // 各ドキュメントを削除
                    deleteCount++;
                });

                showModal('完了', `${deleteCount}件の履歴を消去しました。`);

            } catch (e) {
                console.error("履歴の削除エラー:", e);
                showModal('エラー', '履歴の消去中にエラーが発生しました。');
            }
        };
        
        /** 現在アクティブなルーレットと、それに紐づく履歴を削除 */
        const performDeleteRoulette = async () => {
            const activeId = rouletteManager.activeRouletteId;
            const activeName = getActiveRoulette()?.name || "無名のルーレット";

            // 1. 履歴を削除
            const historyColRef = collection(db, getHistoryCollectionPath(userId));
            const q = query(historyColRef, where('rouletteId', '==', activeId));
            const historySnapshot = await getDocs(q);
            
            historySnapshot.forEach(doc => {
                deleteDoc(doc.ref); 
            });

            // 2. ルーレット設定を削除
            rouletteManager.roulettes = rouletteManager.roulettes.filter(r => r.id !== activeId);
            
            // 3. アクティブIDを次のルーレットに設定
            rouletteManager.activeRoulettesId = rouletteManager.roulettes[0].id;

            // 4. マネージャーを保存
            await saveRouletteManager();

            showModal('完了', `ルーレット「${activeName}」と関連する履歴を削除しました。`);
        };


        // =========================================================================
        // 6. PWA Service Worker 登録
        // =========================================================================

        const registerServiceWorker = () => {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    // PWAを有効にするには、service-worker.js ファイルがサーバーのルートに配置されている必要があります。
                    navigator.serviceWorker.register('./service-worker.js')
                        .then(reg => {
                            console.log('Service Worker 登録成功:', reg);
                        })
                        .catch(err => {
                            console.error('Service Worker 登録失敗:', err);
                        });
                });
            }
        };

        // =========================================================================
        // 7. イベントリスナーの設定
        // =========================================================================

        window.onload = () => {
            initFirebase();
            registerServiceWorker(); // PWA Service Worker 登録を試みる

            // ルーレット選択の切り替え
            document.getElementById('roulette-select').addEventListener('change', (e) => {
                const newId = e.target.value;
                if (newId !== rouletteManager.activeRouletteId) {
                    rouletteManager.activeRouletteId = newId;
                    saveRouletteManager(); // active IDの変更を保存
                    // UI更新はonSnapshotで自動的に行われる
                }
            });

            // 新規ルーレット追加ボタン
            document.getElementById('add-roulette-button').addEventListener('click', addNewRoulette);
            
            // ルーレット削除ボタン
            document.getElementById('delete-roulette-button').addEventListener('click', deleteActiveRoulette);
            
            // 項目数入力の処理
            document.getElementById('set-items-button').addEventListener('click', () => {
                const num = parseInt(document.getElementById('num-items-input').value, 10);
                generateAndUpdateItems(num, true); // trueで強制保存
            });

            // 抽選個数選択の処理 (Firestoreへの保存)
            document.getElementById('draw-count-select').addEventListener('change', async (e) => {
                const newDrawCount = parseInt(e.target.value, 10);
                updateActiveRouletteConfig({ drawCount: newDrawCount });
            });

            // 再度抽選に含めるかどうかの切り替え処理 (Firestoreへの保存)
            document.getElementById('replacement-switch').addEventListener('change', async (e) => {
                const isReplacement = e.target.checked;
                updateActiveRouletteConfig({ isReplacement: isReplacement });
                // UIを即座に更新 (ドット位置と色を更新)
                updateReplacementSwitchAppearance(isReplacement); 
            });

            // 抽選ボタンの処理
            document.getElementById('draw-button').addEventListener('click', drawLottery);
            
            // 履歴消去ボタンの処理
            document.getElementById('clear-history-button').addEventListener('click', () => {
                 showModal('履歴消去の確認', '現在のルーレットの全ての抽選履歴を消去しますか？', true);
            });
            
            // モーダル閉じるボタン
            document.getElementById('modal-close-button').addEventListener('click', closeModal);
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f9;
        }
        /* スイッチのカスタムスタイル */
        .toggle-switch-bg {
            transition: background-color 0.4s;
        }
        .toggle-switch-dot {
            transition: transform 0.4s;
        }
        /* チェックボックス自体は非表示 */
        .toggle-checkbox {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* カスタムアニメーション */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.5s ease-out;
        }
        /* ローディングアニメーション */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-icon {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- メインコンテナ -->
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 border-b pb-2">マルチルーレット項目選択ツール</h1>
        <p id="user-id-display" class="text-xs text-gray-600 mb-4"></p>
        <p id="status-message" class="text-sm text-red-500 mb-4"></p>
        
        <!-- ルーレット管理パネル -->
        <div class="bg-indigo-50 p-4 rounded-xl shadow-inner mb-6 border border-indigo-200">
            <h2 class="text-lg font-semibold text-indigo-800 mb-3">ルーレット管理: <span id="current-roulette-name" class="text-xl font-extrabold ml-1">...</span></h2>

            <div class="flex flex-col md:flex-row md:space-x-3 space-y-3 md:space-y-0">
                <!-- ルーレット選択ドロップダウン -->
                <select id="roulette-select" class="flex-grow p-2 border border-indigo-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    <option value="">ロード中...</option>
                </select>

                <!-- 追加/削除ボタン -->
                <button id="add-roulette-button" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition duration-200 shadow-md flex-shrink-0">
                    + ルーレットを追加
                </button>
                <button id="delete-roulette-button" class="bg-red-500 hover:bg-red-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition duration-200 shadow-md flex-shrink-0">
                    X このルーレットを削除
                </button>
            </div>
        </div>


        <!-- ルーレット/抽選エリア -->
        <div id="roulette-container" class="bg-white p-6 rounded-xl shadow-lg mb-8 border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">抽選シミュレーション</h2>
            
            <!-- 色付き部分に結果全体を表示 -->
            <div id="roulette-display" class="text-5xl font-extrabold text-center text-indigo-600 bg-indigo-50 p-10 rounded-lg shadow-inner mb-6 transition-all duration-300 break-words">
                ?
            </div>

            <p id="result-display" class="text-lg font-medium text-center text-gray-600 mt-4 h-6">結果がここに表示されます</p>

            <button id="draw-button" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 mt-6 transform hover:scale-[1.01] active:scale-[0.98]">
                抽選開始！
            </button>
        </div>

        <!-- 設定エリア -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">現在のルーレットの設定</h2>

            <!-- 項目数設定 -->
            <div class="mb-5 p-3 bg-gray-50 rounded-lg">
                <label for="num-items-input" class="block text-sm font-medium text-gray-700 mb-2">1. 項目数を設定 (1〜1000)</label>
                <div class="flex space-x-3">
                    <input type="number" id="num-items-input" min="1" max="1000" value="10" 
                           class="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                    <button id="set-items-button" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition duration-200">
                        項目を生成
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-1">「項目1」「項目2」...という名前で自動生成され、設定が保存されます。</p>
            </div>

            <!-- 抽選個数設定 -->
            <div class="mb-5 p-3 bg-gray-50 rounded-lg">
                <label for="draw-count-select" class="block text-sm font-medium text-gray-700 mb-2">2. 一度に抽選する個数</label>
                <select id="draw-count-select" 
                        class="w-full p-2 border border-gray-300 rounded-lg bg-white focus:ring-indigo-500 focus:border-indigo-500">
                    <!-- JavaScriptでオプションが生成されます -->
                </select>
            </div>

            <!-- 再度抽選に含めるかどうかの設定 (トグルスイッチ) -->
            <div class="p-3 bg-gray-50 rounded-lg mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">3. 当選項目を再度抽選に含めるか</label>
                <div class="flex items-center space-x-3">
                    <!-- 非復元側 (含めない) のラベル -->
                    <span class="text-sm font-medium text-red-600 font-bold">含めない (非復元抽出)</span>
                    <div class="relative inline-block w-14 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="replacement-switch" id="replacement-switch" class="toggle-checkbox absolute top-0 left-0 block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" checked />
                        
                        <!-- バー (Label) -->
                        <label for="replacement-switch" class="toggle-switch-bg block overflow-hidden h-6 rounded-full bg-blue-600 cursor-pointer shadow-inner"></label>
                        
                        <!-- ドット (Div) -->
                        <div class="toggle-switch-dot absolute top-0 left-0 block w-6 h-6 rounded-full bg-white border-4 shadow transition-all duration-200 ease-in-out"></div>
                    </div>
                    <!-- 復元側 (含める) のラベル -->
                    <span class="text-sm font-medium text-blue-600 font-bold">含める (復元抽出)</span>
                </div>
            </div>

            <!-- 履歴消去ボタン -->
             <button id="clear-history-button" class="w-full bg-red-100 hover:bg-red-200 text-red-600 text-sm font-semibold py-2 px-4 rounded-lg transition duration-200 border border-red-300">
                このルーレットの履歴を消去
            </button>
        </div>

        <!-- 履歴エリア -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border border-gray-200">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">過去の当選履歴 (現在のルーレット)</h2>
            <div id="history-list" class="divide-y divide-gray-200 max-h-96 overflow-y-auto bg-white rounded-lg border border-gray-100">
                <!-- 履歴はJavaScriptで描画されます -->
                <p class="text-gray-500 p-4">履歴を読み込み中...</p>
            </div>
        </div>
    </div>
    
    <!-- カスタムモーダル -->
    <div id="custom-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4" onclick="closeModal()">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6" onclick="event.stopPropagation()">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-3"></h3>
            <p id="modal-message" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end space-x-3">
                <button id="modal-confirm-button" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 hidden">
                    実行
                </button>
                <button id="modal-close-button" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition duration-200">
                    閉じる
                </button>
            </div>
        </div>
    </div>

</body>
</html>
